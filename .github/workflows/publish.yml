name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated release tag (for example, v2.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'TommiL90/td-shell'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify the release repository identity
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module - <<'NODE'
          import packageJson from "./package.json" with { type: "json" };

          const expectedRepository = {
            type: "git",
            url: "git+https://github.com/TommiL90/td-shell.git",
          };
          if (
            packageJson.repository?.type !== expectedRepository.type ||
            packageJson.repository?.url !== expectedRepository.url
          ) {
            throw new Error(
              "package.json.repository must exactly match TommiL90/td-shell.",
            );
          }
          NODE

      - name: Verify exact release tag and protected main commit
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[
            "${DEFAULT_BRANCH}" != "main" ||
            "${GITHUB_REF}" != "refs/heads/main" ||
            "${GITHUB_REF_TYPE}" != "branch"
          ]]; then
            echo "::error::The release workflow must be dispatched from default main."
            exit 1
          fi

          tag="${RELEASE_TAG}"
          node --input-type=module - "${tag}" <<'NODE'
          const tag = process.argv[2];
          const semverTag =
            /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!semverTag.test(tag)) {
            throw new Error(`Release tag is not exact vSemVer: ${tag}`);
          }
          NODE

          remote_refs="$(git ls-remote origin \
            "refs/heads/main" \
            "refs/tags/${tag}" \
            "refs/tags/${tag}^{}")"
          remote_ref() {
            local ref="$1"
            local matches=()
            mapfile -t matches < <(
              printf '%s\n' "${remote_refs}" |
                awk -v expected="${ref}" '$2 == expected { print $1 }'
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::Remote ref ${ref} must resolve exactly once." >&2
              return 1
            fi
            printf '%s' "${matches[0]}"
          }
          remote_main="$(remote_ref "refs/heads/main")"
          remote_tag_object="$(remote_ref "refs/tags/${tag}")"
          remote_tag_commit="$(remote_ref "refs/tags/${tag}^{}")"

          git fetch --atomic --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/release-main" \
            "+refs/tags/${tag}:refs/release-verification/tag"

          if [[ "$(git cat-file -t refs/release-verification/tag)" != "tag" ]]; then
            echo "::error::Release tag ${tag} must be annotated."
            exit 1
          fi

          fetched_main="$(git rev-parse 'refs/remotes/origin/release-main^{commit}')"
          fetched_tag_object="$(git rev-parse refs/release-verification/tag)"
          tag_commit="$(git rev-parse 'refs/release-verification/tag^{commit}')"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          checkout_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[
            "${fetched_main}" != "${remote_main}" ||
            "${fetched_tag_object}" != "${remote_tag_object}" ||
            "${tag_commit}" != "${remote_tag_commit}" ||
            "${tag_commit}" != "${remote_main}" ||
            "${event_commit}" != "${remote_main}" ||
            "${checkout_commit}" != "${remote_main}"
          ]]; then
            echo "::error::Annotated tag, protected remote main, workflow commit, and checkout must be identical."
            exit 1
          fi

          git checkout --detach "${tag_commit}"
          test "$(git rev-parse 'HEAD^{commit}')" = "${tag_commit}"

          package_version="$(node --input-type=module -e \
            "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          if [[ "${tag}" != "v${package_version}" ]]; then
            echo "::error::Release tag ${tag} does not match package.json version ${package_version}."
            exit 1
          fi

          {
            echo "tag=${tag}"
            echo "tag_object=${remote_tag_object}"
            echo "tag_commit=${tag_commit}"
            echo "main_commit=${remote_main}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package contents
        run: node scripts/verify-package-files.mjs

      - name: Reverify protected release authority
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_TAG_OBJECT: ${{ steps.release.outputs.tag_object }}
          EXPECTED_RELEASE_COMMIT: ${{ steps.release.outputs.tag_commit }}
          EXPECTED_MAIN_COMMIT: ${{ steps.release.outputs.main_commit }}
        run: |
          set -euo pipefail

          remote_refs="$(git ls-remote origin \
            "refs/heads/main" \
            "refs/tags/${RELEASE_TAG}" \
            "refs/tags/${RELEASE_TAG}^{}")"
          remote_ref() {
            local ref="$1"
            local matches=()
            mapfile -t matches < <(
              printf '%s\n' "${remote_refs}" |
                awk -v expected="${ref}" '$2 == expected { print $1 }'
            )
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "::error::Remote ref ${ref} must still resolve exactly once." >&2
              return 1
            fi
            printf '%s' "${matches[0]}"
          }

          remote_main="$(remote_ref "refs/heads/main")"
          remote_tag_object="$(remote_ref "refs/tags/${RELEASE_TAG}")"
          remote_tag_commit="$(remote_ref "refs/tags/${RELEASE_TAG}^{}")"
          package_version="$(node --input-type=module -e \
            "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          if [[
            "${remote_main}" != "${EXPECTED_MAIN_COMMIT}" ||
            "${remote_tag_object}" != "${EXPECTED_TAG_OBJECT}" ||
            "${remote_tag_commit}" != "${EXPECTED_RELEASE_COMMIT}" ||
            "$(git rev-parse 'HEAD^{commit}')" != "${EXPECTED_RELEASE_COMMIT}" ||
            "$(git rev-parse "${GITHUB_SHA}^{commit}")" != "${EXPECTED_RELEASE_COMMIT}" ||
            "${RELEASE_TAG}" != "v${package_version}"
          ]]; then
            echo "::error::Release authority changed after verification; refusing the GitHub release."
            exit 1
          fi

      - name: Create the GitHub release when missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists; reusing it."
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${RELEASE_TAG}" --generate-notes
          fi

  installers:
    # Unsigned double-click installers (macOS .command, Windows .cmd, Linux .sh),
    # built from the same verified release commit once the release tag was verified,
    # with stable names so releases/latest/download/<name> links keep working.
    needs: release
    if: github.repository == 'TommiL90/td-shell'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build double-click installers
        run: node scripts/build-installer-bundles.mjs --out "${RUNNER_TEMP}/installers"

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # The tag the release job verified against protected main, not the raw input.
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}"/installers/* --repo "${GITHUB_REPOSITORY}" --clobber

  distribution:
    # The release distribution (S3): tomidev at the verified tag and the exact
    # Pi, with the pnpm-lock.yaml our pinned pnpm resolves for them. tomidev is
    # resolved from its Git tag (git:github.com/TommiL90/td-shell#v<version>),
    # so the tag must exist; nothing is published to the npm registry.
    needs: release
    if: github.repository == 'TommiL90/td-shell'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build the distribution assets
        env:
          # The tag the release job verified against protected main, not the raw input.
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/build-distribution.mjs build --shell "${RELEASE_TAG#v}" --out "${RUNNER_TEMP}/distribution"

      - name: Keep the assets for verification
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tomidev-distribution
          path: ${{ runner.temp }}/distribution/
          if-no-files-found: error
          retention-days: 7

  distribution-verify:
    # The exact assets install with --frozen-lockfile on every system, with our
    # pinned Node and pnpm (and Go on Windows), and the launcher runs them.
    needs: distribution
    if: github.repository == 'TommiL90/td-shell'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Fetch the distribution assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tomidev-distribution
          path: ${{ runner.temp }}/distribution

      - name: Install them frozen and run the launcher
        shell: bash
        run: node scripts/build-distribution.mjs verify --assets "${RUNNER_TEMP}/distribution"

  distribution-assets:
    # Attached only after every verify lane passed, with stable names.
    needs: [release, distribution-verify]
    if: github.repository == 'TommiL90/td-shell'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the verified distribution assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tomidev-distribution
          path: ${{ runner.temp }}/distribution

      - name: Attach the distribution assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}/distribution/tomidev-distribution.json" "${RUNNER_TEMP}/distribution/tomidev-distribution-lock.yaml" --repo "${GITHUB_REPOSITORY}" --clobber
